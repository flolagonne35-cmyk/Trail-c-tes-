name: Côtes Rennes (API IGN)

on:
  workflow_dispatch:
    inputs:
      rayon:
        description: "Demi-côté du carré analysé (m)"
        default: "2000"
      pente_min:
        description: "Seuil de pente (%)"
        default: "5"
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/cotes-rennes.yml"
  schedule:
    - cron: "17 5 1 * *" # le 1er du mois : détecte un changement des services IGN

permissions:
  contents: write # commit des résultats
  issues: write   # signalement des erreurs

concurrency:
  group: cotes-rennes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyse:
    name: ${{ matrix.nom }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: grille
            sortie: resultats/rennes
          - nom: bdtopo
            sortie: resultats/rennes_cotes
          - nom: validation
            sortie: resultats/validation resultats/parcours_ventoux
    env:
      SORTIE: ${{ matrix.sortie }}
      RAYON: ${{ inputs.rayon || '2000' }}
      PENTE_MIN: ${{ inputs.pente_min || '5' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Tests (données fictives, sans réseau)
        run: pytest -q

      - name: Analyse
        id: analyse
        run: |
          set +e
          {
            case "${{ matrix.nom }}" in
              grille) python scripts/cotes_rennes.py --rayon "$RAYON" --pente-min "$PENTE_MIN" --sortie resultats/rennes ;;
              bdtopo) python scripts/cotes_bdtopo.py --rayon "$RAYON" --pente-min "$PENTE_MIN" --sortie resultats/rennes_cotes ;;
              validation)
                # montées de référence, puis segmentation et plan nutrition sur une des traces obtenues
                python scripts/valider_cotes.py --sortie resultats/validation; v=$?
                gpx=$(ls resultats/validation/ventoux_bedoin.gpx resultats/validation/alpe_d_huez.gpx 2>/dev/null | head -1)
                if [ -n "$gpx" ]; then
                  python scripts/segmenter_gpx.py "$gpx" --sortie resultats/parcours_ventoux \
                  && python scripts/plan_nutrition.py resultats/parcours_ventoux/parcours.json \
                       --objectif 2h45 --ravito "15:Chalet Reynard" --temperature 22
                fi
                [ $v -eq 0 ] ;;
            esac
          } 2> >(tee erreurs.log >&2)
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Résumé et annotations
        if: always()
        run: |
          python - <<'EOF'
          import json, os, pathlib
          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          nom = "${{ matrix.nom }}"
          rapports = [p for d in os.environ["SORTIE"].split() for p in sorted(pathlib.Path(d).glob("rapport*.json"))]
          if not rapports:
              print("::error::aucun rapport : le script a planté avant la fin (voir le log)")
              out.write(f"## {nom}\n\nLe script a planté avant d'écrire le rapport.\n")
              raise SystemExit
          for p in rapports:
            r = json.loads(p.read_text())
            out.write(f"## {nom} : {p} — statut `{r['statut']}`\n\n")
            for k, v in (r.get("resume") or {}).items():
                out.write(f"- {k} : **{v}**\n")
            for service in ("wfs", "api"):
                s = r.get(service) or {}
                if s:
                    out.write(f"- {service} : codes HTTP `{s.get('codes_http')}`, durée {s.get('duree_s')} s\n")
                for e in (s.get("erreurs") or [])[:10]:
                    print(f"::warning title={service}::{e[:200]}")
            if (r.get("api") or {}).get("points_nodata"):
                print(f"::warning title=api::{r['api']['points_nodata']} points sans donnée (-99999)")
            if r.get("top"):
                out.write("\n| n° | à | longueur | pente moy | max | D+ | voie | revêtement | technicité | nom |\n|---|---|---|---|---|---|---|---|---|---|\n")
                for c in r["top"]:
                    out.write(f"| {c['id']} | {c['distance_m']} m | {c['longueur_m']} m | {c['pente_moy_pct']} % "
                              f"| {c['pente_max_pct']} % | +{c['dplus_m']} m | {c['type_voie']} | {c.get('revetement', '')} "
                              f"| {c.get('technicite', '')} | {c['nom']} |\n")
            if (r.get("wfs") or {}).get("exemple_proprietes"):
                out.write("\nExemple de propriétés BD TOPO :\n\n```json\n"
                          + json.dumps(r["wfs"]["exemple_proprietes"], ensure_ascii=False, indent=1)[:3000] + "\n```\n")
          EOF

      - name: Enregistrer les résultats dans le dépôt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in $SORTIE; do [ -d "$d" ] && git add "$d"; done
          if git diff --cached --quiet; then
            echo "Aucun changement dans les résultats."
            exit 0
          fi
          git commit -m "Résultats ${{ matrix.nom }} Rennes (${{ steps.analyse.outputs.code == '0' && 'ok' || 'erreur' }}, run ${{ github.run_id }})"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Signaler l'erreur dans une issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titre="Erreur services IGN — ${{ matrix.nom }} Rennes"
          lien="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "Le run [${{ github.run_id }}]($lien) a échoué (code script : \`${{ steps.analyse.outputs.code }}\`)."
            echo
            premier=$(echo $SORTIE | cut -d' ' -f1)
            if [ -f "$premier/rapport.json" ]; then
              echo '```json'
              python -c "import json;r=json.load(open('$premier/rapport.json'));print(json.dumps({'statut':r['statut'],'resume':r.get('resume')}|{s:{k:(r.get(s) or {}).get(k) for k in ('codes_http','erreurs')} for s in ('wfs','api')},ensure_ascii=False,indent=2)[:6000])"
              echo '```'
            elif [ -s erreurs.log ]; then
              echo '```'; tail -n 40 erreurs.log; echo '```'
            fi
          } > corps.md
          num=$(gh issue list --state open --search "\"$titre\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file corps.md
          else
            gh issue create --title "$titre" --body-file corps.md
          fi
