name: Appli Android à installer (APK de test)

# Fabrique l'APK sur GitHub (sans compte Expo) et le publie dans une « Release » du dépôt :
# l'ouvrir depuis le téléphone Android, télécharger le .apk, autoriser l'installation.
# Signé avec la clé de test : pour le Play Store, on passera par EAS avec le compte développeur.

on:
  workflow_dispatch:
  push:
    # nouvelle version à chaque changement de l'appli ou de ses données (côtes, réseau)
    paths:
      - ".github/workflows/android-apk.yml"
      - "app/**"

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Projet Android natif
        run: npx expo prebuild --platform android --no-install
      - name: Compilation (arm64, la quasi-totalité des téléphones récents)
        working-directory: app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Version
        id: v
        run: echo "nom=trail-cotes-$(node -p "require('./app.json').expo.version")-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "${{ steps.v.outputs.nom }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.v.outputs.nom }}
          path: app/${{ steps.v.outputs.nom }}.apk
      - name: Publier dans la release « apk » (lien fixe, à ouvrir depuis le téléphone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "app/${{ steps.v.outputs.nom }}.apk" trail-cotes.apk
          gh release view apk >/dev/null 2>&1 || gh release create apk --target "$GITHUB_SHA" --title "Appli Android de test" \
            --notes "Sur le téléphone Android : télécharger trail-cotes.apk, l'ouvrir et autoriser l'installation depuis le navigateur."
          gh release upload apk trail-cotes.apk --clobber
          gh release edit apk --notes "Version ${{ steps.v.outputs.nom }} (commit ${GITHUB_SHA::7}). Sur le téléphone Android : télécharger trail-cotes.apk, l'ouvrir et autoriser l'installation depuis le navigateur."
