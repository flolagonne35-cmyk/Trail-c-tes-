name: Précalcul des côtes (zones)

on:
  workflow_dispatch:
    inputs:
      zone:
        description: "lat_min,lon_min,lat_max,lon_max"
        default: "48.075,-1.745,48.150,-1.615"
      nom:
        description: "Nom de la base (resultats/base/<nom>.sqlite)"
        default: "rennes"
      max_tuiles:
        description: "Tuiles par passage (0 = toutes) ; relancer pour continuer"
        default: "0"
      taille_lot:
        description: "Points par requête altimétrique (POST JSON)"
        default: "5000"
      paralleles:
        description: "Requêtes altimétriques simultanées"
        default: "1"
      pente_min:
        description: "Pente moyenne minimale d'une côte (%)"
        default: "4"
  push:
    paths:
      - ".github/workflows/precalcul.yml"
      - "scripts/precalcul.py"
      - "trailcotes/base.py"
      - "trailcotes/adresses.py"
      - "trailcotes/bdtopo.py"
      - "scripts/cotes_bdtopo.py"
      - "scripts/zones.json"

permissions:
  contents: write

jobs:
  # zones à calculer : celle saisie au lancement manuel, sinon toutes celles de scripts/zones.json
  zones:
    runs-on: ubuntu-latest
    outputs:
      liste: ${{ steps.l.outputs.liste }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        env:
          NOM: ${{ inputs.nom }}
          ZONE: ${{ inputs.zone }}
        run: |
          if [ -n "$ZONE" ]; then
            echo "liste=[{\"nom\":\"$NOM\",\"zone\":\"$ZONE\"}]" >> "$GITHUB_OUTPUT"
          else
            echo "liste=$(python3 -c 'import json; print(json.dumps(json.load(open("scripts/zones.json"))["zones"]))')" >> "$GITHUB_OUTPUT"
          fi

  precalcul:
    needs: zones
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.zones.outputs.liste) }}
    concurrency:
      group: precalcul-${{ matrix.nom }}
      cancel-in-progress: false
    env:
      ZONE: ${{ matrix.zone }}
      BASE: resultats/base/${{ matrix.nom }}.sqlite
      MAX_TUILES: ${{ inputs.max_tuiles || '0' }}
      TAILLE_LOT: ${{ inputs.taille_lot || '5000' }}
      PARALLELES: ${{ inputs.paralleles || '1' }}
      PENTE_MIN: ${{ inputs.pente_min || '4' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Précalcul (reprend les tuiles déjà faites)
        id: calcul
        run: |
          set +e
          python scripts/precalcul.py --zone "$ZONE" --base "$BASE" --max-tuiles "$MAX_TUILES" \
            --taille-lot "$TAILLE_LOT" --paralleles "$PARALLELES" --pente-min "$PENTE_MIN"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Résumé
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ["BASE"]).with_name("rapport_" + pathlib.Path(os.environ["BASE"]).stem + ".json")
          out = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          if p.exists():
              r = json.loads(p.read_text())
              out.write(f"## Précalcul — `{r['statut']}`\n\n" + "".join(f"- {k} : **{v}**\n" for k, v in r["resume"].items()))
          PY
          python scripts/precalcul.py --cherche 48.1113,-1.68 --rayon 3000 --base "$BASE" | head -15 || true
      - name: Enregistrer la base et les données de l'appli (toutes les zones)
        if: always() && hashFiles('resultats/base/*.sqlite') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # plusieurs zones peuvent tourner en même temps : on repart chaque fois de la dernière
          # version du dépôt, on y remet notre base, puis on réexporte toutes les bases
          cp "$BASE" "$RUNNER_TEMP/base.sqlite"
          cp "resultats/base/rapport_$(basename "$BASE" .sqlite).json" "$RUNNER_TEMP/rapport.json" 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q --hard "origin/${GITHUB_REF_NAME}"
            cp "$RUNNER_TEMP/base.sqlite" "$BASE"
            cp "$RUNNER_TEMP/rapport.json" "resultats/base/rapport_$(basename "$BASE" .sqlite).json" 2>/dev/null || true
            python scripts/exporter_app.py --base resultats/base/*.sqlite --parcours resultats/parcours_ventoux/parcours.json
            git add resultats/base app/assets/data
            git diff --cached --quiet && exit 0
            git commit -q -m "Base de côtes $(basename "$BASE" .sqlite) (run ${{ github.run_id }})"
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 7))
          done
          exit 1
