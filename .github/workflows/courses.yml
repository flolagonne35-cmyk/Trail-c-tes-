name: Calendrier des courses (données ouvertes)

# Courses à venir en France depuis DATAtourisme et OpenAgenda (Licence Ouverte), chaque semaine.

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/courses_ouvertes.py"
      - ".github/workflows/courses.yml"
  schedule:
    - cron: "17 5 * * 1" # chaque lundi

permissions:
  contents: write

jobs:
  courses:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/courses_ouvertes.py
      - name: Résumé
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import json
          r = json.load(open("resultats/courses/rapport.json"))
          print(f"## Courses : {r['statut']}, {r['courses']}\n")
          print("\n".join("- " + a for a in r.get("apercu", [])[:40]))
          PY
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultats/courses app/assets/data/courses.json 2>/dev/null || git add resultats/courses
          git diff --cached --quiet && exit 0
          git commit -m "Calendrier des courses (run ${{ github.run_id }})"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
