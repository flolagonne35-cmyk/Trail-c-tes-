name: Calendrier des courses (données ouvertes)

# Courses à venir en France depuis DATAtourisme et OpenAgenda (Licence Ouverte), chaque jour
# (DATAtourisme publie son export une fois par jour : inutile de lire plus souvent).

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/courses_ouvertes.py"
      - "scripts/enrichir_courses.py"
      - "scripts/datatourisme_complet.py"
      - ".github/workflows/courses.yml"
  schedule:
    - cron: "17 5 * * *" # chaque jour à 5 h 17 UTC

# une exécution à la fois : deux passages simultanés écriraient les mêmes fichiers
concurrency:
  group: courses-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  courses:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/courses_ouvertes.py
      # prix, réservation et dates d'inscription : base complète DATAtourisme (≈ 2 Go, lue en flux) ;
      # en cas d'échec, le calendrier garde les prix relevés dans les annonces
      - name: Base complète DATAtourisme
        continue-on-error: true
        timeout-minutes: 60
        run: python scripts/datatourisme_complet.py
      - name: Résumé
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import json
          r = json.load(open("resultats/courses/rapport.json"))
          print(f"## Courses : {r['statut']}, {r['courses']}\n")
          print("\n".join("- " + a for a in r.get("apercu", [])[:40]))
          try:
              c = json.load(open("resultats/courses/datatourisme_complet.json"))
              print(f"\n## Base complète : {c.get('statut')}, {c.get('avec_prix')} avec prix, {c.get('avec_reservation')} avec réservation, {c.get('avec_dates_inscription')} avec dates")
          except FileNotFoundError:
              pass
          PY
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultats/courses app/assets/data/courses.json app/assets/data/carburants.json 2>/dev/null || git add resultats/courses
          git diff --cached --quiet && exit 0
          git commit -m "Calendrier des courses (run ${{ github.run_id }})"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
