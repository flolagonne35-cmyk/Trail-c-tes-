name: Application (tests)

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Calculs (identiques aux scripts Python)
        run: npm test
      - name: Vérification des types
        run: npm run typecheck
      - name: Style et règles du code (ESLint)
        run: npm run lint
      # expo-doctor compare les paquets à la DERNIÈRE version publiée par Expo : chaque petite mise à
      # jour d'Expo le ferait échouer (et t'enverrait un mail) alors que l'appli marche. On le garde
      # comme avertissement ; la mise à jour se fait avec « npx expo install --fix ».
      - name: Contrôle du projet Expo (expo-doctor, avertissement seulement)
        continue-on-error: true
        run: |
          npx -y expo-doctor@latest || echo "::warning title=Paquets Expo à mettre à jour::Lancer « npx expo install --fix » dans app/ (voir le détail de cette étape)"
      - name: Compilation web
        run: npx expo export --platform web --output-dir dist
