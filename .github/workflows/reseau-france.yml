name: Réseau des boucles (France)

# Le réseau des voies (BD TOPO + D+ RGE ALTI) pour composer les boucles partout en France, sur la
# grille des côtes (tuiles de 4 km), département par département. Chaque job calcule au plus 4 h
# puis range sa base et les fichiers de l'appli (blocs de 12 km, archive reseau_<dep>.tar.gz) dans
# la release « donnees-reseau ». Le dernier job relance tant qu'il reste des tuiles et qu'un
# passage a avancé, et republie l'appli web (dossier /reseau/).

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/reseau-france.yml"
      - "scripts/reseau_france.py"

permissions:
  contents: write
  actions: write

concurrency:
  group: reseau-france
  cancel-in-progress: false

env:
  RELEASE: donnees-reseau
  GH_TOKEN: ${{ github.token }}

jobs:
  departements:
    runs-on: ubuntu-latest
    outputs:
      liste: ${{ steps.l.outputs.liste }}
    steps:
      - uses: actions/checkout@v4
      - name: Release des données (créée une fois)
        run: |
          gh release view "$RELEASE" >/dev/null 2>&1 || gh release create "$RELEASE" --target "$GITHUB_SHA" \
            --title "Réseau des boucles (France)" --notes "Réseau des voies par département pour les boucles de l'appli. Mis à jour par le workflow « Réseau des boucles (France) »."
      - id: l
        # Bretagne et Pays de la Loire d'abord, puis le reste de la France
        run: |
          echo "liste=$(python3 -c 'import json; d=["35","44","56","22","29","49","53","72","85"]; t=[f"{i:02d}" for i in range(1, 96) if i != 20]+["2A","2B","971","972","973","974","976"]; print(json.dumps(d+[x for x in t if x not in d]))')" >> "$GITHUB_OUTPUT"

  calcul:
    needs: departements
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        dep: ${{ fromJSON(needs.departements.outputs.liste) }}
    env:
      DEP: ${{ matrix.dep }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Reprendre la base du département
        run: gh release download "$RELEASE" -p "res_${DEP}.sqlite" -D resultats/reseau_base || echo "première fois"
      - name: Calcul (au plus 4 h, reprise au passage suivant)
        timeout-minutes: 270
        run: python scripts/reseau_france.py --departement "$DEP" --duree-max 240 || true
      - name: Export pour l'appli et rangement dans la release
        if: always() && hashFiles('resultats/reseau_base/res_*.sqlite') != ''
        run: |
          python scripts/reseau_france.py --departement "$DEP" --exporter "resultats/reseau_app/$DEP"
          tar -czf "resultats/reseau_${DEP}.tar.gz" -C "resultats/reseau_app/$DEP" .
          for i in 1 2 3; do
            gh release upload "$RELEASE" "resultats/reseau_base/res_${DEP}.sqlite" "resultats/reseau_base/rapport_res_${DEP}.json" \
              "resultats/reseau_${DEP}.tar.gz" --clobber && break
            sleep $((i * 20))
          done
          python -c "import json; r=json.load(open('resultats/reseau_base/rapport_res_${DEP}.json')); print('## ${DEP} : ' + str(r['resume']))" >> "$GITHUB_STEP_SUMMARY"

  suite:
    needs: calcul
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Avancement de la France
        id: a
        run: |
          mkdir -p r && gh release download "$RELEASE" -p "rapport_res_*.json" -D r || true
          gh release download "$RELEASE" -p "avancement.json" -D r || true
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, re
          faites = restantes = aretes = 0
          for f in pathlib.Path("r").glob("rapport_res_*.json"):
              r = json.loads(f.read_text())["resume"]
              m = re.match(r"(\d+) faites / (\d+) \((\d+) restantes\)", r["Tuiles"])
              if m:
                  faites += int(m.group(1)); restantes += int(m.group(3))
              aretes += int(r["Arêtes dans la base"])
          avant = json.loads(pathlib.Path("r/avancement.json").read_text())["faites"] if pathlib.Path("r/avancement.json").exists() else -1
          pathlib.Path("avancement.json").write_text(json.dumps({"faites": faites, "restantes": restantes, "aretes": aretes}))
          print(f"faites={faites}"); print(f"restantes={restantes}"); print(f"aretes={aretes}")
          print(f"progres={'oui' if faites > avant else 'non'}")
          PY
      - name: Résumé et relance
        run: |
          echo "## France : ${{ steps.a.outputs.faites }} tuiles faites, ${{ steps.a.outputs.restantes }} restantes, ${{ steps.a.outputs.aretes }} tronçons" >> "$GITHUB_STEP_SUMMARY"
          gh release upload "$RELEASE" avancement.json --clobber
          # l'appli web sert le réseau par blocs : on la republie avec les nouvelles données
          gh workflow run web.yml --ref "$GITHUB_REF_NAME" || true
          if [ "${{ steps.a.outputs.restantes }}" != "0" ] && [ "${{ steps.a.outputs.progres }}" = "oui" ]; then
            gh workflow run reseau-france.yml --ref "$GITHUB_REF_NAME"
          fi
