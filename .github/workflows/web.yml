name: Appli web en ligne (Cloudflare Pages)

# À chaque changement de l'appli, la version web est reconstruite et publiée sur Cloudflare Pages
# (projet « trail-cotes », adresse https://trail-cotes.pages.dev), installable sur l'écran
# d'accueil du téléphone (PWA). Il faut les secrets CLOUDFLARE_API_TOKEN (permission « Pages :
# Edit ») ; CLOUDFLARE_ACCOUNT_ID est facultatif. Sans jeton, la publication est sautée.
# Dépôt public : les secrets restent masqués dans les journaux.

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/web.yml"

concurrency:
  group: web
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJET: trail-cotes
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Compilation web, installable (manifeste et icônes de public/, balises ajoutées par scripts/pwa.mjs)
        run: npm run build:web
      - name: Côtes de France par département (release « donnees-cotes », remplie par le précalcul France)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/cotes
          gh release download donnees-cotes -p "cotes_*.json" -D dist/cotes || echo "pas encore de côtes par département"
          python3 ../scripts/index_departements.py dist/cotes
      - name: Réseau des boucles par blocs (release « donnees-reseau », remplie par le workflow « Réseau des boucles (France) »)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/res" dist/reseau
          gh release download donnees-reseau -p "reseau_*.tar.gz" -D "$RUNNER_TEMP/res" || echo "pas encore de réseau France"
          for f in "$RUNNER_TEMP"/res/reseau_*.tar.gz; do [ -e "$f" ] && tar -xzf "$f" -C dist/reseau; done
          python3 ../scripts/index_reseau_france.py dist/reseau
          echo "fichiers publiés : $(find dist -type f | wc -l) (limite Cloudflare Pages : 20 000)"
      - name: Points d'eau (release « donnees-eau », remplie par le workflow « Points d'eau (OpenStreetMap) »)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/eau
          gh release download donnees-eau -p "eau.tar.gz" -D "$RUNNER_TEMP" && tar -xzf "$RUNNER_TEMP/eau.tar.gz" -C dist/eau || echo "pas encore de points d'eau"
          rm -f dist/eau/rapport_eau.json
      - name: Publier sur Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          # l'identifiant de compte est facultatif : wrangler le retrouve avec le jeton
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          # crée le projet la première fois (sans effet s'il existe déjà), puis publie en production
          npx -y wrangler@3 pages project create "$PROJET" --production-branch main || true
          # le projet a été créé avec une autre branche de production : on la passe à main (une fois)
          COMPTE="${CLOUDFLARE_ACCOUNT_ID:-$(npx -y wrangler@3 whoami 2>/dev/null | grep -oE '[0-9a-f]{32}' | head -1)}"
          curl -s -X PATCH -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$COMPTE/pages/projects/$PROJET" -d '{"production_branch":"main"}' | head -c 300; echo
          npx -y wrangler@3 pages deploy dist --project-name "$PROJET" --branch "$GITHUB_REF_NAME" --commit-dirty=true
      - name: Secrets absents
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::Ajoute les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID pour publier l'appli web."
